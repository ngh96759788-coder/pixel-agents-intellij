name: Build & Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install root deps
        run: npm ci

      - name: Install webview deps
        working-directory: webview-ui
        run: npm ci

      - name: Build webview
        run: npm run build

      - name: Run webview unit tests (vitest)
        working-directory: webview-ui
        run: npm test

      - name: Compile + verify plugin structure (Kotlin tests run as part of `check`)
        run: ./gradlew --no-daemon check verifyPluginStructure verifyPluginProjectConfiguration

      - name: Build plugin zip
        run: ./gradlew --no-daemon buildPlugin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-distribution
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

  verify:
    name: Plugin Verifier (recommended IDEs)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 40
    # Verifier downloads several full IDE distributions (hundreds of MB each).
    # Skip on PRs from forks where caching may be unavailable; run on main + manual.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install + build webview
        run: |
          npm ci
          (cd webview-ui && npm ci)
          npm run build

      - name: Run IntelliJ Plugin Verifier
        run: ./gradlew --no-daemon verifyPlugin

      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier/
          if-no-files-found: warn
          retention-days: 14
